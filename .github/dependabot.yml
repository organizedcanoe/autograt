version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [ "minor", "patch" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /backend/Autograt.Api
      - /frontend
    schedule:
      interval: weekly
