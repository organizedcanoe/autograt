name: Docker Image CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/Autograt.Api
          file: ./backend/Autograt.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/autograt-backend:latest
            ghcr.io/${{ github.repository_owner }}/autograt-backend:${{ github.sha }}
      
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/autograt-frontend:latest
            ghcr.io/${{ github.repository_owner }}/autograt-frontend:${{ github.sha }}
