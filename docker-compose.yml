services:
  backend:
    image: ghcr.io/oversizedcanoe/autograt-backend:latest
    container_name: autograt-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/oversizedcanoe/autograt-frontend:latest
    container_name: autograt-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
  
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: autograt_tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    restart: unless-stopped
