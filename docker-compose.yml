# Image tags: MAJOR (e.g. 1, recommended), MAJOR.MINOR (e.g. 1.2), an exact version (e.g. 1.2.3),
# latest, or main (newest commit). Use the same tag for backend and frontend. See docs/deployment.md.

# Keep each container's log (docker logs) to 5 rotated files of 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/oversizedcanoe/autograt-backend:1
    container_name: autograt-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ghcr.io/oversizedcanoe/autograt-frontend:1
    container_name: autograt-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging
  
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: autograt_tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    restart: unless-stopped
    logging: *logging
