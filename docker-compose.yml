# Image tags: latest, MAJOR (e.g. 0), MAJOR.MINOR (e.g. 0.1) or an exact version (e.g. 0.1.57).
# Use the same tag for backend and frontend. See README "Production".
services:
  backend:
    image: ghcr.io/oversizedcanoe/autograt-backend:latest
    container_name: autograt-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/oversizedcanoe/autograt-frontend:latest
    container_name: autograt-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
  
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: autograt_tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    restart: unless-stopped
