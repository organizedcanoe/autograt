map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # The backend rate limits by this address. Behind the Cloudflare tunnel every request comes from
        # cloudflared, so pass Cloudflare's client IP instead, replacing any client-supplied value.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Journal imports can be larger than nginx's 1 MB default; the backend allows the same 25 MB.
    location = /api/import {
        client_max_body_size 25m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Always revalidate these, so a new deploy is picked up (and the update banner shown) promptly.
    location ~ ^/(sw\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        # Set here rather than in a server-level types block, which would replace every default MIME type.
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Built assets have content-hashed filenames, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
