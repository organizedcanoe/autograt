server_tokens off;

# Behind the Cloudflare tunnel every request comes from cloudflared, so use Cloudflare's client IP.
map $http_cf_connecting_ip $tunnel_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# For the Cloudflare tunnel. Not published, so only containers on the Docker network (cloudflared) reach it.
server {
    listen 80;
    set $client_ip $tunnel_client_ip;
    include /etc/nginx/autograt/site.conf;
}

# Published for direct (local or LAN) access. Anyone can send CF-Connecting-IP here, so it is ignored.
server {
    listen 8080;
    set $client_ip $remote_addr;
    include /etc/nginx/autograt/site.conf;
}
